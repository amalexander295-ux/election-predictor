<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predictions | Election Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a class="logo" href="index.html">Election Predictor</a>

            <div class="nav-links">
                <a href="#">Maps</a>
                <a href="#">Polls</a>
                <a href="predictions.html">Predictions</a>
                <a href="#">Results</a>
            </div>
        </nav>
    </header>

    <main>

        <section class="prediction-page">

            <h1>Build Your Prediction</h1>

            <p class="prediction-intro">
                Choose an election and create your own race-by-race forecast.
            </p>

            <div class="prediction-controls">

                <label for="election-select">Election</label>

                <select id="election-select">
                    <option>2026 U.S. Senate</option>
                    <option>2026 Governors</option>
                    <option>2026 U.S. House</option>
                </select>

            </div>

            <div class="seat-counter">

                <div class="party-total democrat">
                    <span class="party-name">Democrats</span>
                    <span class="seat-number">47</span>
                </div>

                <div class="party-total tossup">
                    <span class="party-name">Tossups</span>
                    <span class="seat-number">6</span>
                </div>

                <div class="party-total republican">
                    <span class="party-name">Republicans</span>
                    <span class="seat-number">47</span>
                </div>

            </div>

            <div class="map-section">

    <div class="map-header">
        <h2>2026 U.S. Senate</h2>

        <p>
            Click a state to make your prediction.
        </p>
    </div>

    <div class="map-container">

        <svg
            id="us-map"
            viewBox="0 0 960 600"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Interactive United States election map"
        >

            <rect
                x="0"
                y="0"
                width="960"
                height="600"
                class="map-background"
            ></rect>

            <text
                x="480"
                y="300"
                text-anchor="middle"
                class="map-loading-text"
            >
                U.S. Map
            </text>

        </svg>

    </div>

</div>

        </section>

    </main>

</body>

</html>
